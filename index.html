<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineering Terms Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        .draggable-item {
            cursor: grab;
            transition: all 0.2s ease;
        }
        
        .draggable-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        
        .drop-zone {
            display: inline-block;
            min-width: 200px;
            height: 32px;
            border: 2px dashed #9ca3af;
            border-radius: 4px;
            vertical-align: middle;
            margin: 0 8px;
            background-color: #f9fafb;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .drop-zone.drag-over {
            background-color: #e0e7ff;
            border-color: #4f46e5;
            border-style: solid;
        }

        .drop-zone .draggable-item {
            position: absolute;
            top: -2px; /* Adjust based on border */
            left: -2px;
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            box-shadow: none;
        }

        /* Result styling */
        .correct-answer {
            border-color: #10b981;
            background-color: #d1fae5;
            color: #047857;
            border-style: solid;
        }
        
        .wrong-answer {
            border-color: #ef4444;
            background-color: #fee2e2;
            color: #b91c1c;
            border-style: solid;
        }

        .question-text {
            line-height: 2.2;
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-10">
        <div class="border-b pb-4 mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Software Engineering Terms</h1>
            <p class="text-lg font-medium text-gray-700">Choose the correct terms from the following list <span class="font-bold">[13 marks]</span></p>
            <p class="text-sm text-gray-500 mt-1">💡 Instructions: Drag the terms from the box below and drop them into the correct blanks. You can click a filled blank to return the term to the box.</p>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-5 mb-8">
            <div id="term-bank" class="flex flex-wrap gap-3">
                <!-- Terms will be generated here by JavaScript -->
            </div>
        </div>

        <div id="questions-container" class="space-y-6">
            <!-- Questions will be generated here by JavaScript -->
        </div>

        <div class="mt-10 flex flex-col sm:flex-row items-center justify-between border-t pt-6 gap-4">
            <div id="score-display" class="text-xl font-bold text-gray-800 hidden">
                Score: <span id="score-value" class="text-indigo-600">0</span> / 13
            </div>
            <div class="flex gap-4 w-full sm:w-auto">
                <button id="reset-btn" class="flex-1 sm:flex-none px-6 py-2.5 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition-colors">
                    Reset
                </button>
                <button id="submit-btn" class="flex-1 sm:flex-none px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 shadow-md transition-colors">
                    Submit Answers
                </button>
            </div>
        </div>
    </div>

    <script>
        const terms = [
            { id: 1, text: "Software engineering" },
            { id: 2, text: "Requirement Engineering" },
            { id: 3, text: "User requirements" },
            { id: 4, text: "System requirements" },
            { id: 5, text: "Functional requirements" },
            { id: 6, text: "Non-functional requirements" },
            { id: 7, text: "Use cases" },
            { id: 8, text: "Class diagrams" },
            { id: 9, text: "Architectural design" },
            { id: 10, text: "Architecture patterns" },
            { id: 11, text: "Scrum" },
            { id: 12, text: "Design pattern" },
            { id: 13, text: "Scenarios" }
        ];

        const questions = [
            { id: 1, prefix: "", suffix: " is centered round a set of sprints which are fixed time periods when a system increment is developed.", answerId: 11 },
            { id: 2, prefix: "", suffix: " define what should be implemented so may be part of a contract between client and contractor.", answerId: 4 },
            { id: 3, prefix: "", suffix: " describe the architecture, explain when it may be used and describe its advantages and disadvantages.", answerId: 10 },
            { id: 4, prefix: "", suffix: " is concerned with understanding how a software system should be organized and designing the overall structure.", answerId: 9 },
            { id: 5, prefix: "", suffix: " is the process of establishing the services that a customer requires from a system.", answerId: 2 },
            { id: 6, prefix: "", suffix: " constrain the system being developed and the development process being used.", answerId: 6 },
            { id: 7, prefix: "Software design and implementation is the stage in the ", suffix: " process at which an executable software system is developed.", answerId: 1 },
            { id: 8, prefix: "", suffix: " are statements in natural language plus diagrams of the services the system provides and its operational constraints. Written for customers.", answerId: 3 },
            { id: 9, prefix: "", suffix: " are statements of services the system should provide, how the system should react to particular inputs and how the system should behave in particular situations.", answerId: 5 },
            { id: 10, prefix: "Each ", suffix: " represents a discrete task that involves external interaction with a system.", answerId: 7 },
            { id: 11, prefix: "", suffix: " are used when developing an object-oriented system model to show the classes in a system and the associations between these classes.", answerId: 8 },
            { id: 12, prefix: "A ", suffix: " is a way of reusing abstract knowledge about a problem and its solution.", answerId: 12 },
            { id: 13, prefix: "", suffix: " and user stories are real-life examples of how a system can be used.", answerId: 13 }
        ];

        let draggedElement = null;

        function initApp() {
            renderTermsBank();
            renderQuestions();
            setupEventListeners();
        }

        function renderTermsBank() {
            const bank = document.getElementById('term-bank');
            bank.innerHTML = '';
            
            // Randomize terms for display
            const shuffledTerms = [...terms].sort(() => Math.random() - 0.5);

            shuffledTerms.forEach(term => {
                const termEl = createTermElement(term);
                bank.appendChild(termEl);
            });
        }

        function createTermElement(term) {
            const el = document.createElement('div');
            el.className = 'draggable-item bg-white border border-gray-300 text-gray-800 px-3 py-1.5 rounded shadow-sm text-sm font-medium hover:bg-gray-50';
            el.draggable = true;
            el.dataset.id = term.id;
            // Add numbering visual as in the original image
            el.innerHTML = `<span class="text-gray-400 mr-1">①</span> ${term.text}`.replace('①', `&#${10111 + term.id};`);
            
            el.addEventListener('dragstart', handleDragStart);
            el.addEventListener('dragend', handleDragEnd);
            el.addEventListener('click', handleTermClick);
            
            return el;
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'text-base text-gray-800 question-text flex items-baseline flex-wrap';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'font-bold mr-2 text-gray-900 w-8 inline-block';
                numSpan.textContent = `1.${index + 1}.`;

                const prefixSpan = document.createElement('span');
                prefixSpan.textContent = q.prefix;

                const dropZone = document.createElement('div');
                dropZone.className = 'drop-zone';
                dropZone.dataset.questionId = q.id;
                
                const suffixSpan = document.createElement('span');
                suffixSpan.textContent = q.suffix;

                qDiv.appendChild(numSpan);
                if (q.prefix) qDiv.appendChild(prefixSpan);
                qDiv.appendChild(dropZone);
                if (q.suffix) qDiv.appendChild(suffixSpan);

                // Add Drag & Drop events for dropzone
                dropZone.addEventListener('dragover', handleDragOver);
                dropZone.addEventListener('dragleave', handleDragLeave);
                dropZone.addEventListener('drop', handleDrop);

                container.appendChild(qDiv);
            });
        }

        function handleDragStart(e) {
            draggedElement = this;
            e.dataTransfer.effectAllowed = 'move';
            // Slight delay to allow visually moving it before hiding original
            setTimeout(() => {
                if(draggedElement.parentElement.id !== 'term-bank') {
                     // If we are dragging FROM a dropzone, we don't hide it completely, just let it drag
                } else {
                    this.style.opacity = '0.5';
                }
            }, 0);
        }

        function handleDragEnd(e) {
            this.style.opacity = '1';
            draggedElement = null;
            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.stopPropagation();
            this.classList.remove('drag-over');
            
            // Remove previous styling if any
            this.classList.remove('correct-answer', 'wrong-answer');

            if (draggedElement) {
                // If there's already an item in this dropzone, send it back to bank
                const existingItem = this.querySelector('.draggable-item');
                if (existingItem) {
                    document.getElementById('term-bank').appendChild(existingItem);
                }
                // Append the dragged item to the dropzone
                this.appendChild(draggedElement);
            }
            return false;
        }

        // Clicking a term inside a drop zone returns it to the bank
        function handleTermClick(e) {
            if (this.parentElement.classList.contains('drop-zone')) {
                // Remove grading classes from parent
                this.parentElement.classList.remove('correct-answer', 'wrong-answer');
                document.getElementById('term-bank').appendChild(this);
            }
        }

        function setupEventListeners() {
            document.getElementById('submit-btn').addEventListener('click', checkAnswers);
            document.getElementById('reset-btn').addEventListener('click', resetQuiz);
        }

        function checkAnswers() {
            let score = 0;
            
            questions.forEach(q => {
                const dropZone = document.querySelector(`.drop-zone[data-question-id="${q.id}"]`);
                const placedItem = dropZone.querySelector('.draggable-item');
                
                // Clear old classes
                dropZone.classList.remove('correct-answer', 'wrong-answer');
                dropZone.style.backgroundColor = '';
                dropZone.style.borderColor = '';

                if (placedItem) {
                    const selectedTermId = parseInt(placedItem.dataset.id);
                    if (selectedTermId === q.answerId) {
                        dropZone.classList.add('correct-answer');
                        score++;
                    } else {
                        dropZone.classList.add('wrong-answer');
                    }
                } else {
                    dropZone.classList.add('wrong-answer');
                }
            });

            const scoreDisplay = document.getElementById('score-display');
            const scoreValue = document.getElementById('score-value');
            scoreValue.textContent = score;
            scoreDisplay.classList.remove('hidden');

            // Feedback Message
            let message = "Keep trying!";
            if(score === 13) message = "Perfect Score! Excellent job.";
            else if(score > 9) message = "Great job! Almost there.";
            
            // Note: Replaced alert with dynamic DOM update
            let feedbackEl = document.getElementById('feedback-message');
            if(!feedbackEl) {
                feedbackEl = document.createElement('div');
                feedbackEl.id = 'feedback-message';
                feedbackEl.className = 'mt-4 text-center font-bold p-3 rounded-lg';
                document.getElementById('score-display').parentElement.appendChild(feedbackEl);
            }
            
            feedbackEl.textContent = message;
            if(score === 13) {
                feedbackEl.classList.add('bg-green-100', 'text-green-800');
                feedbackEl.classList.remove('bg-yellow-100', 'text-yellow-800', 'bg-red-100', 'text-red-800');
            } else if (score > 6) {
                feedbackEl.classList.add('bg-yellow-100', 'text-yellow-800');
                feedbackEl.classList.remove('bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            } else {
                feedbackEl.classList.add('bg-red-100', 'text-red-800');
                feedbackEl.classList.remove('bg-green-100', 'text-green-800', 'bg-yellow-100', 'text-yellow-800');
            }
        }

        function resetQuiz() {
            document.getElementById('score-display').classList.add('hidden');
            const feedbackEl = document.getElementById('feedback-message');
            if(feedbackEl) feedbackEl.remove();
            
            // Move all items back to bank
            document.querySelectorAll('.drop-zone .draggable-item').forEach(item => {
                document.getElementById('term-bank').appendChild(item);
            });
            
            // Reset dropzone styles
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.classList.remove('correct-answer', 'wrong-answer');
            });
            
            // Re-shuffle bank
            renderTermsBank();
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>
