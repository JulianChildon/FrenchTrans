  <!-- 引入 Babel 以在浏览器编译 JSX -->

  <style>

    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel" data-type="module">

    // --- 题库资料 ---

        {

            "超市外面排了很长的队伍。"
          ]
        },
        {

          answer: "他让父亲七点叫醒他。",
          options: [
            "他让父亲七点叫醒他。",
            "他的父亲要求他七点起床。",
            "他每天早上七点叫醒父亲。",
            "他问父亲明天是否七点起床。"
          ]
        },
        {
          id: 12,
          question: "Nous ne perdons pas de temps pendant nos courses.",
          answer: "我们购物时从不浪费时间。",
          options: [
            "我们购物时从不浪费时间。",
            "我们花了很多时间在购物上。",
            "他们买东西时总是动作很快。",
            "我们没有时间去买东西。"
          ]
        }
      ],
      zh2fr: [
        {
          id: 1,
          question: "今天的风景真美啊！",
          answer: "Quel beau paysage aujourd'hui !",
          options: [
            "Quel beau paysage aujourd'hui !",
            "Quel mauvais temps aujourd'hui !",
            "Quelle belle journée aujourd'hui !",
            "Le paysage est très beau demain."
          ]
        },
        {
          id: 2,
          question: "保罗十分想念他的家人。",
          answer: "Paul pense beaucoup à sa famille.",
          options: [
            "Paul pense beaucoup à sa famille.",
            "Paul oublie souvent sa famille.",
            "Paul téléphone souvent à sa famille.",
            "Paul habite avec sa famille."
          ]
        },
        {
          id: 3,
          question: "在这座大城市里只有几家小商铺。",
          answer: "Il n'y a que quelques petites boutiques dans cette grande ville.",
          options: [
            "Il n'y a que quelques petites boutiques dans cette grande ville.",
            "Il y a beaucoup de grands magasins dans cette ville.",
            "Il n'y a pas de petites boutiques dans cette grande ville.",
            "Il y a seulement un supermarché dans ce village."
          ]
        },
        {
          id: 4,
          question: "你明天可以给我打电话。",
          answer: "Tu peux me téléphoner demain.",
          options: [
            "Tu peux me téléphoner demain.",
            "Je vais te téléphoner demain.",
            "Tu dois m'appeler aujourd'hui.",
            "Tu peux venir me voir demain."
          ]
        },
        {
          id: 5,
          question: "她走得很慢，因为她不想太累。",
          answer: "Elle marche lentement parce qu'elle ne veut pas être trop fatiguée.",
          options: [
            "Elle marche lentement parce qu'elle ne veut pas être trop fatiguée.",
            "Elle marche vite parce qu'elle est en retard.",
            "Elle ne marche pas parce qu'elle est déjà fatiguée.",
            "Il marche lentement parce qu'il ne veut pas être fatigué."
          ]
        },
        {
          id: 6,
          question: "我们每天都在食堂吃饭。",
          answer: "Nous mangeons au resto-U tous les jours.",
          options: [
            "Nous mangeons au resto-U tous les jours.",
            "Nous allons souvent au restaurant.",
            "Ils mangent à la cantine aujourd'hui.",
            "Nous préparons les repas tous les jours."
          ]
        },
        {
          id: 7,
          question: "我刚刚在商场买了一些水果。",
          answer: "Je viens d'acheter des fruits dans le grand magasin.",
          options: [
            "Je viens d'acheter des fruits dans le grand magasin.",
            "Je vais acheter des légumes au marché.",
            "Il vient d'acheter des pommes au supermarché.",
            "Je viens de manger des fruits dans le magasin."
          ]
        },
        {
          id: 8,
          question: "请鼓起勇气，不要害怕。",
          answer: "Aie du courage et n'aie pas peur.",
          options: [
            "Aie du courage et n'aie pas peur.",
            "Ayez de la patience et ne pleurez pas.",
            "Il faut avoir du courage et peur.",
            "Sois courageux et fais attention."
          ]
        },
        {
          id: 9,
          question: "这座房子面朝一条小河。",
          answer: "Cette maison donne sur une petite rivière.",
          options: [
            "Cette maison donne sur une petite rivière.",
            "Cette maison se trouve près de la montagne.",
            "Cet appartement donne sur la rue.",
            "Cette maison est loin de la rivière."
          ]
        },
        {
          id: 10,
          question: "同学们都喜欢在周末购物。",
          answer: "Les étudiants aiment faire des achats le week-end.",
          options: [
            "Les étudiants aiment faire des achats le week-end.",
            "Les professeurs aiment se reposer le week-end.",
            "Les étudiants doivent étudier pendant le week-end.",
            "Les enfants n'aiment pas faire les courses."
          ]
        },
        {
          id: 11,
          question: "我们应该把这封信寄给她。",
          answer: "Nous devons lui envoyer cette lettre.",
          options: [
            "Nous devons lui envoyer cette lettre.",
            "Nous pouvons lire cette lettre pour elle.",
            "Ils doivent nous envoyer cette lettre.",
            "Nous voulons lui donner ce cadeau."
          ]
        },
        {
          id: 12,
          question: "他昨天在博物馆待了一个小时。",
          answer: "Il est resté une heure au musée hier.",
          options: [
            "Il est resté une heure au musée hier.",
            "Il va rester une heure au musée demain.",
            "Il a visité le musée pendant deux heures.",
            "Elle est restée à la maison hier."
          ]
        },
        {
          id: 13,
          question: "这家医院在山脚下，非常有名。",
          answer: "Cet hôpital se trouve au pied de la montagne, il est très connu.",
          options: [
            "Cet hôpital se trouve au pied de la montagne, il est très connu.",
            "这所学校位于山脚下。",
            "这家医院很大但不有名。",
            "这座山在医院的后面。"
          ]
        }
      ]
    };

    // 工具函数：打乱数组顺序 (Fisher-Yates)
    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    function App() {
      const [category, setCategory] = useState('fr2zh'); // 'fr2zh' 或 'zh2fr'
      const [mode, setMode] = useState('mcq'); // 'mcq' (选择) 或 'typing' (填空对比)
      
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      
      const [userInput, setUserInput] = useState('');
      const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // 初始化或切换分类时加载题目
      useEffect(() => {
        const rawQuestions = questionsData[category];
        // 预先打乱每个选择题的选项
        const processedQuestions = rawQuestions.map(q => ({
          ...q,
          shuffledOptions: shuffleArray(q.options)
        }));
        setQuestions(processedQuestions);
        resetQuiz();
      }, [category]);

      const resetQuiz = () => {
        setCurrentIndex(0);
        setScore(0);
        setUserInput('');
        setIsAnswerRevealed(false);
        setSelectedOption(null);
        setIsFinished(false);
        setErrorMsg('');
      };

      const handleModeChange = (newMode) => {
        setMode(newMode);
        resetQuiz();
      };

      const currentQuestion = questions[currentIndex];

      const handleNextQuestion = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setUserInput('');
          setIsAnswerRevealed(false);
          setSelectedOption(null);
          setErrorMsg('');
        } else {
          setIsFinished(true);
        }
      };

      // 选择题处理
      const handleOptionClick = (option) => {
        if (isAnswerRevealed) return; // 已经回答过就不能再点
        
        setSelectedOption(option);
        setIsAnswerRevealed(true);
        
        if (option === currentQuestion.answer) {
          setScore(score + 1);
        }
      };

      // 填空题处理
      const handleRevealAnswer = () => {
        if (!userInput.trim()) {
          setErrorMsg("请先输入您的翻译答案！");
          return;
        }
        setErrorMsg('');
        setIsAnswerRevealed(true);
      };

      const handleSelfGrade = (isCorrect) => {
        if (isCorrect) {
          setScore(score + 1);
        }
        handleNextQuestion();
      };

      const handleInputChange = (e) => {
        setUserInput(e.target.value);
        if (errorMsg) setErrorMsg('');
      };

      if (questions.length === 0) return <div className="text-center p-10">载入中...</div>;

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-3xl mx-auto">
            
            {/* 头部标题与设定区 */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
              <h1 className="text-2xl md:text-3xl font-bold text-center text-indigo-700 mb-6">
                法语翻译综合题库
              </h1>
              
              <div className="flex flex-col md:flex-row gap-4 justify-center items-center">
                {/* 分类切换 */}
                <div className="flex bg-slate-100 p-1 rounded-lg">
                  <button 
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${category === 'fr2zh' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                    onClick={() => setCategory('fr2zh')}
                  >
                    法译中
                  </button>
                  <button 
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${category === 'zh2fr' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                    onClick={() => setCategory('zh2fr')}
                  >
                    中译法
                  </button>
                </div>

                {/* 模式切换 */}
                <div className="flex bg-slate-100 p-1 rounded-lg">
                  <button 
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${mode === 'mcq' ? 'bg-white shadow text-emerald-600' : 'text-slate-500 hover:text-slate-700'}`}
                    onClick={() => handleModeChange('mcq')}
                  >
                    选择题模式
                  </button>
                  <button 
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${mode === 'typing' ? 'bg-white shadow text-emerald-600' : 'text-slate-500 hover:text-slate-700'}`}
                    onClick={() => handleModeChange('typing')}
                  >
                    填空对比模式
                  </button>
                </div>
              </div>
            </div>

            {/* 测验完成画面 */}
            {isFinished ? (
              <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-8 text-center animate-fade-in">
                <div className="text-5xl mb-4">🏆</div>
                <h2 className="text-2xl font-bold mb-2">测验完成！</h2>
                <p className="text-lg text-slate-600 mb-6">
                  您的得分：<span className="text-indigo-600 font-bold text-3xl">{score}</span> / {questions.length}
                </p>
                <button 
                  onClick={resetQuiz}
                  className="bg-indigo-600 text-white px-8 py-3 rounded-lg font-medium hover:bg-indigo-700 transition-colors shadow-md"
                >
                  重新开始测验
                </button>
              </div>
            ) : (
              /* 测验进行区 */
              <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 md:p-8">
                {/* 进度条 */}
                <div className="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                  <span>进度：{currentIndex + 1} / {questions.length}</span>
                  <span>得分：{score}</span>
                </div>
                <div className="w-full bg-slate-100 rounded-full h-2 mb-8">
                  <div 
                    className="bg-indigo-500 h-2 rounded-full transition-all duration-300" 
                    style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}
                  ></div>
                </div>

                {/* 题目显示 */}
                <div className="mb-8">
                  <h2 className="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed">
                    {currentQuestion.question}
                  </h2>
                </div>

                {/* 模式：选择题 */}
                {mode === 'mcq' && (
                  <div className="space-y-3">
                    {currentQuestion.shuffledOptions.map((option, index) => {
                      let buttonClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ";
                      
                      if (!isAnswerRevealed) {
                        buttonClass += "border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-700";
                      } else {
                        if (option === currentQuestion.answer) {
                          buttonClass += "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium"; // 正确答案
                        } else if (option === selectedOption) {
                          buttonClass += "border-rose-500 bg-rose-50 text-rose-800"; // 选错的答案
                        } else {
                          buttonClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60"; // 其他选项
                        }
                      }

                      return (
                        <button
                          key={index}
                          onClick={() => handleOptionClick(option)}
                          disabled={isAnswerRevealed}
                          className={buttonClass}
                        >
                          <div className="flex items-center">
                            <span className="w-8 h-8 flex items-center justify-center bg-white rounded-full border shadow-sm mr-3 text-sm font-bold text-slate-500">
                              {String.fromCharCode(65 + index)}
                            </span>
                            <span className="text-lg">{option}</span>
                          </div>
                        </button>
                      );
                    })}
                    
                    {/* 选择题下一题按钮 */}
                    {isAnswerRevealed && (
                      <div className="mt-8 flex justify-end animate-fade-in">
                        <button 
                          onClick={handleNextQuestion}
                          className="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700 transition-colors shadow-sm flex items-center"
                        >
                          下一题 ➔
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* 模式：填空对比 */}
                {mode === 'typing' && (
                  <div>
                    {!isAnswerRevealed ? (
                      <div className="space-y-4 animate-fade-in">
                        <textarea
                          value={userInput}
                          onChange={handleInputChange}
                          placeholder="请在此输入您的翻译..."
                          className={`w-full h-32 p-4 border-2 rounded-xl focus:ring-0 resize-none text-lg text-slate-700 ${errorMsg ? 'border-rose-400 focus:border-rose-500' : 'border-slate-200 focus:border-indigo-500'}`}
                        />
                        {errorMsg && (
                          <p className="text-rose-500 text-sm font-medium animate-fade-in">
                            {errorMsg}
                          </p>
                        )}
                        <button 
                          onClick={handleRevealAnswer}
                          className="w-full bg-indigo-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-sm text-lg"
                        >
                          提交并对比答案
                        </button>
                      </div>
                    ) : (
                      <div className="space-y-6 animate-fade-in">
                        <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                          <p className="text-sm text-slate-500 mb-1 font-medium">您的翻译：</p>
                          <p className="text-lg text-slate-800 mb-4 pb-4 border-b border-slate-200">
                            {userInput}
                          </p>
                          <p className="text-sm text-emerald-600 mb-1 font-medium">标准答案：</p>
                          <p className="text-xl font-bold text-emerald-700">
                            {currentQuestion.answer}
                          </p>
                        </div>

                        <div className="text-center">
                          <p className="text-slate-600 font-medium mb-4">请为自己评分：您翻译得正确吗？</p>
                          <div className="flex gap-4 justify-center">
                            <button 
                              onClick={() => handleSelfGrade(false)}
                              className="flex-1 max-w-[160px] bg-white border-2 border-rose-200 text-rose-600 hover:bg-rose-50 px-4 py-3 rounded-xl font-bold transition-colors"
                            >
                              ❌ 需要练习
                            </button>
                            <button 
                              onClick={() => handleSelfGrade(true)}
                              className="flex-1 max-w-[160px] bg-emerald-500 text-white hover:bg-emerald-600 px-4 py-3 rounded-xl font-bold transition-colors shadow-sm"
                            >
                              ✅ 完全正确
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
