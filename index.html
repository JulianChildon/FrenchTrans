    // 工具函数：打乱数组顺序 (Fisher-Yates)
    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    // --- 模块 1：翻译训练 (保留原有功能) ---
    function TranslationQuiz() {
      const [category, setCategory] = useState('fr2zh');
      const [mode, setMode] = useState('mcq');
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [userInput, setUserInput] = useState('');
      const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        const rawQuestions = questionsData[category];
        const processedQuestions = rawQuestions.map(q => ({
          ...q, shuffledOptions: shuffleArray(q.options)
        }));
        setQuestions(processedQuestions);
        resetQuiz();
      }, [category]);

      const resetQuiz = () => {
        setCurrentIndex(0); setScore(0); setUserInput(''); setIsAnswerRevealed(false);
        setSelectedOption(null); setIsFinished(false); setErrorMsg('');
      };

      const handleModeChange = (newMode) => {
        setMode(newMode); resetQuiz();
      };

      const handleNextQuestion = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(currentIndex + 1); setUserInput(''); setIsAnswerRevealed(false);
          setSelectedOption(null); setErrorMsg('');
        } else {
          setIsFinished(true);
        }
      };

      const handleOptionClick = (option) => {
        if (isAnswerRevealed) return;
        setSelectedOption(option); setIsAnswerRevealed(true);
        if (option === questions[currentIndex].answer) setScore(score + 1);
      };

      const handleRevealAnswer = () => {
        if (!userInput.trim()) { setErrorMsg("请先输入您的翻译答案！"); return; }
        setErrorMsg(''); setIsAnswerRevealed(true);
      };

      if (questions.length === 0) return <div className="text-center p-10">载入中...</div>;

      const currentQuestion = questions[currentIndex];

      return (
        <div className="max-w-3xl mx-auto animate-fade-in">
          {/* 设置区 */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <div className="flex flex-col md:flex-row gap-4 justify-center items-center">
              <div className="flex bg-slate-100 p-1 rounded-lg">
                <button className={`px-4 py-2 rounded-md font-medium transition-colors ${category === 'fr2zh' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`} onClick={() => setCategory('fr2zh')}>法译中</button>
                <button className={`px-4 py-2 rounded-md font-medium transition-colors ${category === 'zh2fr' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`} onClick={() => setCategory('zh2fr')}>中译法</button>
              </div>

    // --- 模块 2：语法题库 ---
    function GrammarQuiz() {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isFinished, setIsFinished] = useState(false);

      useEffect(() => {
        // 随机抽取所有语法题
        const processedQuestions = shuffleArray(grammarQuestionsData).map(q => ({
          ...q, shuffledOptions: shuffleArray(q.options)
        }));
        setQuestions(processedQuestions);
      }, []);

      const resetQuiz = () => {
        setCurrentIndex(0); setScore(0); setIsAnswerRevealed(false);
        setSelectedOption(null); setIsFinished(false);
        setQuestions(shuffleArray(grammarQuestionsData).map(q => ({...q, shuffledOptions: shuffleArray(q.options)})));
      };

      const handleNextQuestion = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(currentIndex + 1); setIsAnswerRevealed(false); setSelectedOption(null);
        } else {
          setIsFinished(true);
        }
      };

      const handleOptionClick = (option) => {
        if (isAnswerRevealed) return;
        setSelectedOption(option); setIsAnswerRevealed(true);
        if (option === questions[currentIndex].answer) setScore(score + 1);
      };

      if (questions.length === 0) return <div className="text-center p-10">载入中...</div>;
      const currentQuestion = questions[currentIndex];

      return (
        <div className="max-w-3xl mx-auto animate-fade-in">
          {isFinished ? (
             <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-8 text-center">
              <div className="text-5xl mb-4">🎖️</div>
              <h2 className="text-2xl font-bold mb-2">语法测验完成！</h2>
              <p className="text-lg text-slate-600 mb-6">得分：<span className="text-blue-600 font-bold text-3xl">{score}</span> / {questions.length}</p>
              <button onClick={resetQuiz} className="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 shadow-md">再练一次</button>
            </div>
          ) : (
            <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 md:p-8">
              <div className="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded-full">考点：{currentQuestion.category}</span>
                <span>进度：{currentIndex + 1} / {questions.length} &nbsp;|&nbsp; 得分：{score}</span>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-2 mb-8">
                <div className="bg-blue-500 h-2 rounded-full transition-all duration-300" style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}></div>
              </div>
              <div className="mb-8"><h2 className="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed">{currentQuestion.question}</h2></div>
              
              <div className="space-y-3">
                {currentQuestion.shuffledOptions.map((option, index) => {
                  let buttonClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ";
                  if (!isAnswerRevealed) {
                    buttonClass += "border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-700";
                  } else {
                    if (option === currentQuestion.answer) buttonClass += "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium";
                    else if (option === selectedOption) buttonClass += "border-rose-500 bg-rose-50 text-rose-800";
                    else buttonClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                  }
                  return (
                    <button key={index} onClick={() => handleOptionClick(option)} disabled={isAnswerRevealed} className={buttonClass}>
                      <div className="flex items-center"><span className="w-8 h-8 flex items-center justify-center bg-white rounded-full border shadow-sm mr-3 text-sm font-bold text-slate-500">{String.fromCharCode(65 + index)}</span><span className="text-lg">{option}</span></div>
                    </button>
                  );
                })}
              </div>

              {isAnswerRevealed && (
                <div className="mt-6 p-5 bg-blue-50 border border-blue-200 rounded-xl animate-fade-in">
                  <h3 className="text-blue-800 font-bold mb-2 flex items-center"><span className="mr-2">💡</span> 知识点解析</h3>
                  <p className="text-blue-900 leading-relaxed">{currentQuestion.explanation}</p>
                  <div className="mt-6 flex justify-end">
                    <button onClick={handleNextQuestion} className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 shadow-sm">下一题 ➔</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // --- 模块 3：子组件 变位填空练习 ---
    function ConjugationPractice() {
      const [inputs, setInputs] = useState(Array(10).fill(''));
      const [results, setResults] = useState(null);

      const checkAnswers = () => {
        const res = inputs.map((input, idx) => {
          const correctAns = conjugationExercises[idx].a.toLowerCase().trim();
          // 兼容 suis resté 和 suis restée
          if (idx === 5 && (input.toLowerCase().trim() === 'suis resté' || input.toLowerCase().trim() === 'suis restée')) return true;
          return input.toLowerCase().trim() === correctAns;
        });
        setResults(res);
      };

      return (
        <div className="mt-12 border-t pt-8 border-slate-200">
          <h3 className="text-2xl font-bold text-indigo-800 mb-6 flex items-center">✍️ 动词变位填空实战</h3>
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
            {conjugationExercises.map((ex, index) => {
              const parts = ex.q.split('______');
              return (
                <div key={ex.id} className="flex flex-col md:flex-row md:items-center gap-3 text-lg text-slate-700 border-b border-slate-100 pb-4 last:border-0">
                  <div className="flex-1 flex flex-wrap items-center gap-2">
                    <span>{parts[0]}</span>
                    <input 
                      type="text" 
                      className={`w-32 px-3 py-1 border-b-2 bg-slate-50 focus:outline-none text-center font-medium
                        ${results ? (results[index] ? 'border-emerald-500 text-emerald-700' : 'border-rose-500 text-rose-700') : 'border-slate-300 focus:border-indigo-500'}`}
                      value={inputs[index]}
                      onChange={(e) => {
                        const newInputs = [...inputs];
                        newInputs[index] = e.target.value;
                        setInputs(newInputs);
                        setResults(null); // 修改后清除结果
                      }}
                      placeholder="变位"
                    />
                    <span>{parts[1]}</span>
                  </div>
                  {results && !results[index] && (
                    <div className="text-sm font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-md">正确: {ex.a}</div>
                  )}
                  {results && results[index] && (
                    <div className="text-sm text-emerald-500">✅</div>
                  )}
                </div>
              );
            })}
            <div className="pt-4 flex justify-end">
              <button onClick={checkAnswers} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-sm">提交检查</button>
            </div>
          </div>
        </div>
      );
    }

                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">副代词 en 与 y</h3>
                  <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <div className="mb-4">
                      <p className="font-bold text-slate-800">📌 副代词 en</p>
                      <p className="text-sm text-slate-600 mb-1">代替 <strong>de + 名词</strong> (表示数量、种类或来源)。</p>
                      <p className="text-sm text-indigo-600">例: Voulez-vous des fleurs? - Oui, je peux <strong>en</strong> offrir.</p>
                      <p className="text-sm text-indigo-600">例: Il n'y <strong>en</strong> a pas beaucoup.</p>
                    </div>
                    <div className="border-t border-slate-200 pt-4">
                      <p className="font-bold text-slate-800">📌 副代词 y</p>
                      <p className="text-sm text-slate-600 mb-1">代替 <strong>à/dans/sur/sous + 地点名词</strong>。</p>
                      <p className="text-sm text-indigo-600">例: Tu vas à la bibliothèque? - Oui, j'<strong>y</strong> vais.</p>
                      <p className="text-sm text-indigo-600">固定结构: Il n'<strong>y</strong> a que cinq magasins.</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">代词式动词 (se + verbe)</h3>
                  <div className="bg-rose-50 border border-rose-100 p-5 rounded-xl text-rose-900">
                    <p className="font-bold mb-2">⚠️ 核心规则：</p>
                    <p className="text-sm">在复合过去时中，代词式动词的助动词<strong>永远是 être</strong>！且过去分词必须与主语进行性数配合（除绝对不配合的特例外）。</p>
                    <p className="text-sm mt-2 text-rose-700">例：Elle <strong>s'est lavée</strong>. / Nous <strong>nous sommes rencontrés</strong> hier.</p>
                  </div>
                </div>
              </div>
            )}

            {activeSection === 'verbs' && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-8">
                <h2 className="text-2xl font-bold text-slate-800 flex items-center"><span className="text-3xl mr-3">⚡</span>核心动词语式与时态</h2>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">复合过去时 (Passé composé)</h3>
                  <p className="text-slate-600 text-sm">强调动作的结果或完成性。核心在于<strong>助动词的选择</strong>。</p>
                  
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                      <p className="font-bold text-emerald-800 mb-2">助动词 être</p>
                      <ul className="list-disc pl-5 text-sm text-emerald-900 space-y-1">
                        <li>用于位移动词 (aller, venir, partir, arriver...)</li>
                        <li>用于状态变化动词 (naître, mourir...)</li>
                        <li>用于所有代词式动词</li>
                        <li className="font-bold text-rose-500">过去分词必须与主语配合！</li>
                      </ul>
                      <p className="text-xs text-emerald-700 mt-2">例: Elles <strong>sont parties</strong>.</p>
                    </div>
                    <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl">
                      <p className="font-bold text-blue-800 mb-2">助动词 avoir</p>
                      <ul className="list-disc pl-5 text-sm text-blue-900 space-y-1">
                        <li>用于绝大部分及物和不及物动词</li>
                        <li>过去分词一般不变</li>
                        <li className="font-bold text-rose-500">仅当直接宾语前置时需配合！</li>
                      </ul>
                      <p className="text-xs text-blue-700 mt-2">例: Nous <strong>avons visité</strong> le musée.</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">命令式 (Impératif)</h3>
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-700 text-sm space-y-2">
                    <p>👉 <strong>规则1：</strong> 由直陈式现在时去掉主语构成（只有 tu, nous, vous 三个人称）。</p>
                    <p>👉 <strong>规则2：</strong> 第一组动词(-er)的 tu 形式必须去掉词尾的 s。 <span className="text-indigo-600">Parle! (非 Parles!)</span></p>
                    <p>👉 <strong>规则3 (肯定式)：</strong> 代词置于动词后，用连字符连接。 <span className="text-indigo-600">Donne-lui cette lettre.</span></p>
                    <p>👉 <strong>规则4 (否定式)：</strong> 代词恢复置于动词前。 <span className="text-indigo-600">Ne le fais pas.</span></p>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">高频动词搭配</h3>
                  <ul className="bg-white border border-slate-200 rounded-xl divide-y text-sm">
                    <li className="p-3 flex justify-between"><span className="font-bold">demander à qn de faire</span> <span className="text-slate-500">请求某人做某事</span></li>
                    <li className="p-3 flex justify-between"><span className="font-bold">savoir faire qch</span> <span className="text-slate-500">懂得/会做某事</span></li>
                    <li className="p-3 flex justify-between"><span className="font-bold">avoir envie de faire</span> <span className="text-slate-500">想要做某事</span></li>
                    <li className="p-3 flex justify-between"><span className="font-bold">venir de faire qch</span> <span className="text-slate-500">刚刚做完某事</span></li>
                    <li className="p-3 flex justify-between"><span className="font-bold">penser à qn/qch</span> <span className="text-slate-500">想念/思考...</span></li>
                  </ul>
                </div>
              </div>
            )}

            {activeSection === 'structure' && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-8">
                <h2 className="text-2xl font-bold text-slate-800 flex items-center"><span className="text-3xl mr-3">🏗️</span>核心句子结构</h2>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">强调句：C'est ... qui / que</h3>
                  <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4">
                    <div>
                      <p className="font-bold text-slate-800 mb-1">1. 强调主语：用 <span className="text-indigo-600">qui</span> 引导</p>
                      <p className="text-sm text-slate-600">注意：强调复数主语时，C'est 变为 Ce sont。从句动词需与前面的主语配合。</p>
                      <p className="text-sm font-medium mt-1 bg-white inline-block p-2 rounded shadow-sm">
                        <span className="text-indigo-600">Ce sont</span> Juliette et moi <span className="text-indigo-600">qui</span> sommes en retard.
                      </p>
                    </div>
                    <div className="border-t border-slate-200 pt-4">
                      <p className="font-bold text-slate-800 mb-1">2. 强调宾语/状语：用 <span className="text-indigo-600">que</span> 引导</p>
                      <p className="text-sm font-medium mt-1 bg-white inline-block p-2 rounded shadow-sm mb-2 block">
                        <span className="text-slate-400">强调地点：</span><span className="text-indigo-600">C'est</span> dans un supermarché <span className="text-indigo-600">que</span> Charlotte a fait des achats.
                      </p>
                      <p className="text-sm font-medium bg-white inline-block p-2 rounded shadow-sm block">
                        <span className="text-slate-400">强调时间：</span><span className="text-indigo-600">C'est</span> hier <span className="text-indigo-600">que</span> je l'ai vu.
                      </p>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-bold text-indigo-700 border-l-4 border-indigo-500 pl-3">无人称句型 (Il)</h3>
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                      <p className="font-bold text-blue-800 mb-2">il y a (存在)</p>
                      <p className="text-sm text-blue-900 mb-2">表示“有”。</p>
                      <ul className="text-sm text-blue-700 space-y-1">
                        <li>肯定：Il y a un bus.</li>
                        <li>否定：Il n'y a pas de bus.</li>
                        <li>疑问：Y a-t-il un problème?</li>
                      </ul>
                    </div>
                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                      <p className="font-bold text-emerald-800 mb-2">il faut (需求)</p>
                      <p className="text-sm text-emerald-900 mb-2">表示“需要/必须”。</p>
                      <ul className="text-sm text-emerald-700 space-y-1">
                        <li>+ 名词：Il me faut 2 kilos.</li>
                        <li>+ 不定式：Il faut aller...</li>
                        <li>+ que从句：Il faut que tu...</li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeSection === 'conjugation' && (
              <div className="space-y-8">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                  <h2 className="text-2xl font-bold text-slate-800 flex items-center mb-6"><span className="text-3xl mr-3">🔄</span>必背动词变位字典</h2>
                  
                  <div className="grid md:grid-cols-2 gap-4">
                    {/* 基础动词扩充 */}
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">être (是)</h4>
                      <p className="text-sm text-slate-700 mb-1">suis, es, est, sommes, êtes, sont</p>
                      <p className="text-xs text-slate-500">P.P: été (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">avoir (有)</h4>
                      <p className="text-sm text-slate-700 mb-1">ai, as, a, avons, avez, ont</p>
                      <p className="text-xs text-slate-500">P.P: eu (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">aller (去)</h4>
                      <p className="text-sm text-slate-700 mb-1">vais, vas, va, allons, allez, vont</p>
                      <p className="text-xs text-slate-500">P.P: allé (助动词: être)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">venir (来)</h4>
                      <p className="text-sm text-slate-700 mb-1">viens, viens, vient, venons, venez, viennent</p>
                      <p className="text-xs text-slate-500">P.P: venu (助动词: être)</p>
                    </div>

                    {/* PPT提及的动词 */}
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">prendre (拿/吃)</h4>
                      <p className="text-sm text-slate-700 mb-1">prends, prends, prend, prenons, prenez, prennent</p>
                      <p className="text-xs text-slate-500">P.P: pris (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">lire (读)</h4>
                      <p className="text-sm text-slate-700 mb-1">lis, lis, lit, lisons, lisez, lisent</p>
                      <p className="text-xs text-slate-500">P.P: lu (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">faire (做/从事)</h4>
                      <p className="text-sm text-slate-700 mb-1">fais, fais, fait, faisons, faites, font</p>
                      <p className="text-xs text-slate-500">P.P: fait (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">dire (说)</h4>
                      <p className="text-sm text-slate-700 mb-1">dis, dis, dit, disons, dites, disent</p>
                      <p className="text-xs text-slate-500">P.P: dit (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">voir (看见)</h4>
                      <p className="text-sm text-slate-700 mb-1">vois, vois, voit, voyons, voyez, voient</p>
                      <p className="text-xs text-slate-500">P.P: vu (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">savoir (知道/会)</h4>
                      <p className="text-sm text-slate-700 mb-1">sais, sais, sait, savons, savez, savent</p>
                      <p className="text-xs text-slate-500">P.P: su (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">connaître (认识)</h4>
                      <p className="text-sm text-slate-700 mb-1">connais, connais, connaît, connaissons, connaissez, connaissent</p>
                      <p className="text-xs text-slate-500">P.P: connu (助动词: avoir)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">partir (出发/离开)</h4>
                      <p className="text-sm text-slate-700 mb-1">pars, pars, part, partons, partez, partent</p>
                      <p className="text-xs text-rose-500">P.P: parti (助动词: être)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">rester (停留)</h4>
                      <p className="text-sm text-slate-700 mb-1">reste, restes, reste, restons, restez, restent</p>
                      <p className="text-xs text-rose-500">P.P: resté (助动词: être)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">arriver (到达)</h4>
                      <p className="text-sm text-slate-700 mb-1">arrive, arrives, arrive, arrivons, arrivez, arrivent</p>
                      <p className="text-xs text-rose-500">P.P: arrivé (助动词: être)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">rentrer (返回/回家)</h4>
                      <p className="text-sm text-slate-700 mb-1">rentre, rentres, rentre, rentrons, rentrez, rentrent</p>
                      <p className="text-xs text-rose-500">P.P: rentré (助动词: être)</p>
                    </div>
                    <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                      <h4 className="font-bold text-indigo-800 text-lg mb-2">devoir (必须/应该)</h4>
                      <p className="text-sm text-slate-700 mb-1">dois, dois, doit, devons, devez, doivent</p>
                      <p className="text-xs text-slate-500">P.P: dû (助动词: avoir)</p>
                    </div>
                  </div>

                  {/* 变位填空练习组件 */}
                  <ConjugationPractice />
                  
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 根组件 App ---
    function App() {
      const [activeModule, setActiveModule] = useState('translation'); // translation, grammar, knowledge

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
          
          {/* 顶部导航 */}
          <div className="max-w-6xl mx-auto mb-8">
            <h1 className="text-3xl md:text-4xl font-black text-center text-indigo-800 tracking-tight mb-8 drop-shadow-sm">
              🇫🇷 法语翻译与语法综合系统
            </h1>
            
            <div className="flex justify-center">
              <div className="inline-flex bg-white rounded-2xl shadow-sm p-1.5 border border-slate-200">
                <button 
                  onClick={() => setActiveModule('translation')}
                  className={`px-6 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'translation' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'}`}
                >
                  🌍 翻译训练
                </button>
                <button 
                  onClick={() => setActiveModule('grammar')}
                  className={`px-6 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'grammar' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'}`}
                >
                  📝 语法题库
                </button>
                <button 
                  onClick={() => setActiveModule('knowledge')}
                  className={`px-6 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'knowledge' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'}`}
                >
                  📚 知识库大全
                </button>
              </div>
            </div>
          </div>

          {/* 模块路由展示 */}
          {activeModule === 'translation' && <TranslationQuiz />}
          {activeModule === 'grammar' && <GrammarQuiz />}
          {activeModule === 'knowledge' && <KnowledgeBase />}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
