    // 工具函数：打乱数组顺序 (Fisher-Yates)
    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    // --- 模块 2：语法题库 ---
    function GrammarQuiz() {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isFinished, setIsFinished] = useState(false);

      const [view, setView] = useState('quiz');
      const [quizMode, setQuizMode] = useState('all');
      const [history, setHistory] = useState([]);
      const [wrongQuestions, setWrongQuestions] = useState([]);
      const [showClearConfirm, setShowClearConfirm] = useState(false);

      useEffect(() => {
        const savedHistory = JSON.parse(localStorage.getItem('grammarHistory')) || [];
        const savedWrong = JSON.parse(localStorage.getItem('grammarWrong')) || [];
        setHistory(savedHistory);
        setWrongQuestions(savedWrong);
        startQuiz('all', savedWrong);
      }, []);

      useEffect(() => {
        localStorage.setItem('grammarHistory', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
        localStorage.setItem('grammarWrong', JSON.stringify(wrongQuestions));
      }, [wrongQuestions]);

      const startQuiz = (mode, currentWrong = wrongQuestions) => {
        setQuizMode(mode);
        setScore(0);
        setCurrentIndex(0);
        setIsAnswerRevealed(false);
        setSelectedOption(null);
        setIsFinished(false);
        setView('quiz');

        let pool = mode === 'all' ? grammarQuestionsData : currentWrong;
        if (mode === 'wrong' && pool.length === 0) {
          pool = grammarQuestionsData;
          setQuizMode('all');
        }

        const processedQuestions = shuffleArray(pool).map(q => ({
          ...q, shuffledOptions: shuffleArray(q.options)
        }));
        setQuestions(processedQuestions);
      };

      const handleNextQuestion = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(currentIndex + 1); setIsAnswerRevealed(false); setSelectedOption(null);
        } else {
          setIsFinished(true);
          const newRecord = {
            id: Date.now(),
            date: new Date().toLocaleString(),
            score: score,
            total: questions.length,
            mode: quizMode === 'all' ? '全部题库' : '错题特训'
          };
          setHistory(prev => [newRecord, ...prev]);
        }
      };

      const handleOptionClick = (option) => {
        if (isAnswerRevealed) return;
        setSelectedOption(option);
        setIsAnswerRevealed(true);
        
        const currentQ = questions[currentIndex];
        const isCorrect = option === currentQ.answer;

        if (isCorrect) {
          setScore(score + 1);
          if (quizMode === 'wrong') {
            setWrongQuestions(prev => prev.filter(q => q.id !== currentQ.id));
          }
        } else {
          setWrongQuestions(prev => {
            if (!prev.find(q => q.id === currentQ.id)) {
                const originalQ = grammarQuestionsData.find(q => q.id === currentQ.id);
                return [...prev, originalQ];
            }
            return prev;
          });
        }
      };

      if (questions.length === 0) return <div className="text-center p-10">载入中...</div>;

      if (view === 'records') {
        return (
          <div className="max-w-3xl mx-auto animate-fade-in">
            <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 md:p-8">
              <div className="flex justify-between items-center mb-6 border-b pb-4">
                <h2 className="text-2xl font-bold text-indigo-800">📊 错题本与作答记录</h2>
                <button onClick={() => setView('quiz')} className="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg hover:bg-slate-200 font-medium transition-colors">🔙 返回题库</button>
              </div>
              
              <div className="mb-10">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-xl font-bold text-slate-800 flex items-center">📝 错题本 <span className="ml-2 text-sm bg-rose-100 text-rose-700 px-2 py-1 rounded-full">{wrongQuestions.length} 题</span></h3>
                    {wrongQuestions.length > 0 && (
                      showClearConfirm ? (
                        <div className="flex gap-2 items-center">
                          <span className="text-sm text-rose-600 font-bold">确认清空？</span>
                          <button onClick={() => { setWrongQuestions([]); setShowClearConfirm(false); }} className="text-sm bg-rose-500 text-white px-3 py-1.5 rounded hover:bg-rose-600">是</button>
                          <button onClick={() => setShowClearConfirm(false)} className="text-sm bg-slate-200 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-300">否</button>
                        </div>

    function ConjugationPractice() {
      const [inputs, setInputs] = useState(Array(10).fill(''));
      const [results, setResults] = useState(null);

      const checkAnswers = () => {
        const res = inputs.map((input, idx) => {
          const correctAns = conjugationExercises[idx].a.toLowerCase().trim();
          if (idx === 5 && (input.toLowerCase().trim() === 'suis resté' || input.toLowerCase().trim() === 'suis restée')) return true;
          return input.toLowerCase().trim() === correctAns;
        });
        setResults(res);
      };

      return (
        <div className="mt-12 border-t pt-8 border-slate-200">
          <h3 className="text-2xl font-bold text-indigo-800 mb-6 flex items-center">✍️ 动词变位填空实战</h3>
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
            {conjugationExercises.map((ex, index) => {
              const parts = ex.q.split('______');
              return (
                <div key={ex.id} className="flex flex-col md:flex-row md:items-center gap-3 text-lg text-slate-700 border-b border-slate-100 pb-4 last:border-0">
                  <div className="flex-1 flex flex-wrap items-center gap-2">
                    <span>{parts[0]}</span>
                    <input 
                      type="text" 
                      className={`w-32 px-3 py-1 border-b-2 bg-slate-50 focus:outline-none text-center font-medium
                        ${results ? (results[index] ? 'border-emerald-500 text-emerald-700' : 'border-rose-500 text-rose-700') : 'border-slate-300 focus:border-indigo-500'}`}
                      value={inputs[index]}
                      onChange={(e) => {
                        const newInputs = [...inputs];
                        newInputs[index] = e.target.value;
                        setInputs(newInputs);
                        setResults(null);
                      }}
                      placeholder="变位"
                    />
                    <span>{parts[1]}</span>
                  </div>
                  {results && !results[index] && (
                    <div className="text-sm font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-md">正确: {ex.a}</div>
                  )}
                  {results && results[index] && (
                    <div className="text-sm text-emerald-500">✅</div>
                  )}
                </div>
              );
            })}
            <div className="pt-4 flex justify-end">
              <button onClick={checkAnswers} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-sm">提交检查</button>
            </div>
          </div>
        </div>
      );
    }

    // --- 模块 4：子组件 - 期中考试卷 ---
    function ExamMidterm() {
      const [activePart, setActivePart] = useState('part1');

      const [p1Answers, setP1Answers] = useState({});
      const [p1Score, setP1Score] = useState(null);

      const [p2Answers, setP2Answers] = useState({ A: {}, B: {}, C: {}, D_a: {}, D_b: {} });
      const [p2Classify, setP2Classify] = useState({ Profession: [], Aliment: [], Famille: [], Temps: [] });
      const [p2Unclassified, setP2Unclassified] = useState(examData.part2_classify.words);
      const [selectedWord, setSelectedWord] = useState(null);
      const [p2Score, setP2Score] = useState(null);

      const [p34Revealed, setP34Revealed] = useState(false);
      const [p34Scores, setP34Scores] = useState({ p3A: 0, p3B: 0, p4A: 0, p4B: 0 });

      const handleP1Select = (qId, optionIndex) => {
        if (p1Score !== null) return;
        setP1Answers({ ...p1Answers, [qId]: optionIndex });
      };

      const submitP1 = () => {
        let score = 0;
        examData.part1_mcq.forEach(q => {
          if (p1Answers[q.id] !== undefined && q.options[p1Answers[q.id]] === q.answer) {
            score += 1;
          }
        });
        setP1Score(score);
      };

      const handleP2Input = (section, qId, value) => {
        if (p2Score !== null) return;
        setP2Answers({ ...p2Answers, [section]: { ...p2Answers[section], [qId]: value } });
      };

      const handleWordClick = (word) => {
        if (p2Score !== null) return;
        if (selectedWord === word) setSelectedWord(null);
        else setSelectedWord(word);
      };

      const assignWordToCategory = (category) => {
        if (!selectedWord || p2Score !== null) return;
        
        setP2Unclassified(p2Unclassified.filter(w => w !== selectedWord));
        const newClassify = { ...p2Classify };
        Object.keys(newClassify).forEach(k => {
          newClassify[k] = newClassify[k].filter(w => w !== selectedWord);
        });

        newClassify[category].push(selectedWord);
        setP2Classify(newClassify);
        setSelectedWord(null);
      };

      const unassignWord = (word, category) => {
        if (p2Score !== null) return;
        const newClassify = { ...p2Classify };
        newClassify[category] = newClassify[category].filter(w => w !== word);
        setP2Classify(newClassify);
        setP2Unclassified([...p2Unclassified, word]);
      };

      const submitP2 = () => {
        let score = 0;
        ['A', 'B', 'C', 'D_a', 'D_b'].forEach(sec => {
          examData.part2_fill[sec].forEach(q => {
            const userAns = (p2Answers[sec][q.id] || '').trim().toLowerCase();
            const correctAns = q.a.toLowerCase();
            if (userAns === correctAns) {
              score += (sec === 'A' || sec === 'D_a' || sec === 'D_b') ? 1 : 0.5;
            }
          });
        });
        Object.keys(examData.part2_classify.answers).forEach(cat => {
          p2Classify[cat].forEach(word => {
            if (examData.part2_classify.answers[cat].includes(word)) {
              score += 0.5;
            }
          });
        });
        setP2Score(score);
      };

      const renderOptions = (q, selectedIdx, showResult) => {
        return (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3">
            {q.options.map((opt, idx) => {
              const isSelected = selectedIdx === idx;
              const isCorrect = opt === q.answer;
              let btnClass = "border rounded-lg px-3 py-2 text-sm text-left transition-colors ";
              
              if (!showResult) {
                btnClass += isSelected ? "bg-indigo-100 border-indigo-400 text-indigo-800 font-bold" : "bg-white border-slate-200 hover:bg-slate-50";
              } else {
                if (isCorrect) btnClass += "bg-emerald-100 border-emerald-500 text-emerald-800 font-bold";
                else if (isSelected && !isCorrect) btnClass += "bg-rose-100 border-rose-500 text-rose-800 line-through";
                else btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
              }

              return (
                <button key={idx} disabled={showResult} onClick={() => handleP1Select(q.id, idx)} className={btnClass}>
                  {String.fromCharCode(65 + idx)}. {opt}
                </button>
              );
            })}
          </div>
        );
      };

      return (
        <div className="max-w-5xl mx-auto animate-fade-in">
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6 sticky top-4 z-10">
            <h2 className="font-bold text-slate-800 mb-3 text-center">期中考试卷导航</h2>
            <div className="flex flex-wrap gap-2 justify-center">
              {[
                { id: 'part1', title: 'I. 单项选择 (25分)' },
                { id: 'part2', title: 'II. 填空与变位 (35分)' },
                { id: 'part3', title: 'III. 句子变换 (20分)' },
                { id: 'part4', title: 'IV. 翻译句子 (20分)' }
              ].map(tab => (

                  <h3 className="text-xl font-bold text-indigo-800 border-b pb-2">III、句子变换 (10分)</h3>
                  
                  <div className="space-y-6">
                    <h4 className="font-bold text-slate-700">A. 强调句转换（请使用 C'est... qui / C'est... que / Ce sont... qui 结构重写句子）</h4>
                    {exam2Data.part3_transform.A.map((q, idx) => (
                      <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p className="font-medium text-slate-800 mb-2">{idx + 1}. {q.q}</p>
                        <textarea className="w-full h-16 p-2 text-sm border border-slate-300 rounded focus:border-indigo-500 focus:ring-0 resize-none mb-2" placeholder="输入您的改写..."></textarea>
                        {p34Revealed && (
                          <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-100 text-sm text-emerald-700 font-medium">参考答案：{q.a}</div>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="space-y-6">
                    <h4 className="font-bold text-slate-700">B. 命令式转换</h4>
                    {exam2Data.part3_transform.B.map((q, idx) => (
                      <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p className="font-medium text-slate-800 mb-2">{idx + 1}. {q.q}</p>
                        <input type="text" className="w-full p-2 text-sm border border-slate-300 rounded focus:border-indigo-500 mb-2" placeholder="输入命令式..." />
                        {p34Revealed && (
                          <div className="bg-emerald-50 p-2 rounded-lg border border-emerald-100 text-sm text-emerald-700 font-medium">参考答案：{q.a}</div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activePart === 'part4' && (
                <div className="space-y-8">
                  <h3 className="text-xl font-bold text-indigo-800 border-b pb-2">IV、翻译句子 (25分)</h3>
                  
                  <div className="space-y-6">
                    <h4 className="font-bold text-slate-700">A. 法译汉 (把下列句子译成中文)</h4>
                    {exam2Data.part4_translation.A.map((q, idx) => (
                      <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p className="font-medium text-slate-800 mb-2">{idx + 1}. {q.q}</p>
                        <input type="text" className="w-full p-2 text-sm border border-slate-300 rounded focus:border-indigo-500 mb-2" placeholder="中文翻译..." />
                        {p34Revealed && (
                          <div className="bg-emerald-50 p-2 rounded-lg border border-emerald-100 text-sm text-emerald-700 font-medium">参考答案：{q.a}</div>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="space-y-6">
                    <h4 className="font-bold text-slate-700">B. 汉译法 (把下列句子译成法语)</h4>
                    {exam2Data.part4_translation.B.map((q, idx) => (
                      <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p className="font-medium text-slate-800 mb-2">{idx + 1}. {q.q}</p>
                        <input type="text" className="w-full p-2 text-sm border border-slate-300 rounded focus:border-indigo-500 mb-2" placeholder="Traduction en français..." />
                        {p34Revealed && (
                          <div className="bg-emerald-50 p-2 rounded-lg border border-emerald-100 text-sm text-emerald-700 font-medium">参考答案：{q.a}</div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {!p34Revealed ? (
                 <div className="mt-8 flex justify-center border-t pt-6">
                  <button onClick={() => setP34Revealed(true)} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-md">完成作答，查看参考答案</button>
                </div>
              ) : (
                <div className="mt-8 border-t pt-6 text-center">
                  <h4 className="font-bold text-slate-800 mb-4 text-lg">自我评分板</h4>
                  <div className="flex flex-wrap justify-center gap-4 mb-4">
                    {activePart === 'part3' && (
                      <>
                        <label className="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-lg border">
                          III-A 得分: <input type="number" max="10" min="0" className="w-16 border rounded p-1 text-center" onChange={e => setP34Scores({...p34Scores, p3A: Number(e.target.value)})} />
                        </label>
                        <label className="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-lg border">
                          III-B 得分: <input type="number" max="10" min="0" className="w-16 border rounded p-1 text-center" onChange={e => setP34Scores({...p34Scores, p3B: Number(e.target.value)})} />
                        </label>
                      </>
                    )}
                    {activePart === 'part4' && (
                      <>
                        <label className="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-lg border">
                          IV-A 得分: <input type="number" max="10" min="0" className="w-16 border rounded p-1 text-center" onChange={e => setP34Scores({...p34Scores, p4A: Number(e.target.value)})} />
                        </label>
                        <label className="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-lg border">
                          IV-B 得分: <input type="number" max="10" min="0" className="w-16 border rounded p-1 text-center" onChange={e => setP34Scores({...p34Scores, p4B: Number(e.target.value)})} />
                        </label>
                      </>
                    )}
                  </div>
                  <div className="text-xl font-black text-indigo-700 bg-indigo-50 inline-block px-6 py-2 rounded-xl">
                    本页总计得分: {activePart === 'part3' ? p34Scores.p3A + p34Scores.p3B : p34Scores.p4A + p34Scores.p4B}
                  </div>
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    // --- 模块 4：全卷检测页面 (整合入口) ---
    function FullExam() {
      const [activePaper, setActivePaper] = useState('midterm');

      return (
        <div className="max-w-5xl mx-auto animate-fade-in">
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6 flex justify-center gap-4">
            <button 
              onClick={() => setActivePaper('midterm')}
              className={`px-6 py-2 rounded-xl font-bold transition-all ${activePaper === 'midterm' ? 'bg-rose-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-rose-50 hover:text-rose-600'}`}
            >
              📝 试卷一：期中考综合卷
            </button>
            <button 
              onClick={() => setActivePaper('core')}
              className={`px-6 py-2 rounded-xl font-bold transition-all ${activePaper === 'core' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600'}`}
            >
              📘 试卷二：核心语法综合测试
            </button>
          </div>

          {activePaper === 'midterm' ? <ExamMidterm /> : <ExamCoreGrammar />}
        </div>
      );
    }

    // --- 根组件 App ---
    function App() {
      const [activeModule, setActiveModule] = useState('knowledge'); // 为了方便您检视新功能，预设进入知识库模块

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
          
          {/* 顶部导航 */}
          <div className="max-w-6xl mx-auto mb-8">
            <h1 className="text-3xl md:text-4xl font-black text-center text-indigo-800 tracking-tight mb-8 drop-shadow-sm">
              法语翻译与语法综合系统
            </h1>
            
            <div className="flex justify-center flex-wrap gap-2">
              <div className="inline-flex bg-white rounded-2xl shadow-sm p-1.5 border border-slate-200 overflow-x-auto">
                <button 
                  onClick={() => setActiveModule('translation')}
                  className={`whitespace-nowrap px-4 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'translation' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'}`}
                >
                  🌍 翻译训练
                </button>
                <button 
                  onClick={() => setActiveModule('grammar')}
                  className={`whitespace-nowrap px-4 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'grammar' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'}`}
                >
                  📝 语法题库
                </button>
                <button 
                  onClick={() => setActiveModule('knowledge')}
                  className={`whitespace-nowrap px-4 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'knowledge' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'}`}
                >
                  📚 知识库大全
                </button>
                <button 
                  onClick={() => setActiveModule('fullexam')}
                  className={`whitespace-nowrap px-4 py-3 rounded-xl font-bold text-sm md:text-base transition-all ${activeModule === 'fullexam' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50 hover:text-rose-600'}`}
                >
                  ⏱️ 全卷检测
                </button>
              </div>
            </div>
          </div>

          {/* 模块路由展示 */}
          {activeModule === 'translation' && <TranslationQuiz />}
          {activeModule === 'grammar' && <GrammarQuiz />}
          {activeModule === 'knowledge' && <KnowledgeBase />}
          {activeModule === 'fullexam' && <FullExam />}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
